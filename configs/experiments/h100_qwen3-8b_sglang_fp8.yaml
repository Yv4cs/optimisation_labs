# Engine comparison on 1x H100. sglang, fp8: NVIDIA ModelOpt FP8 (per-tensor W8A8 + FP8 KV), same weights for all engines (docs/methodology.md D-011).
# Same ShareGPT workload as the T4 baseline (t4_qwen3b_fp16.yaml), so the curves are comparable.
name: h100-qwen3-8b-sglang-fp8
milestone: M4
runtime: sglang
model: nvidia/Qwen3-8B-FP8
precision: fp8
tp: 1
dp: 1
max_model_len: 4096
prefix_caching: false
interconnect: SXM  # H100 SXM5; change to PCIe if the pod is an H100 PCIe
pod_hourly_usd: 4.39  # RunPod Secure Cloud price shown on the pod (the recorded runs used 3.99, see docs/findings.md F9)

concurrency: [1, 16, 64, 256]
dataset:
  kind: sharegpt
  output_len: 256
min_requests: 32
requests_per_slot: 4
warmup_requests: 16
repeats: 3
max_cv: 0.05
