# T4-to-H100 bridge: the T4 baseline setup (Qwen2.5-3B, FP16, vLLM) on H100, so T4 vs H100 is the same model and workload.
# FP16 rather than BF16 to match T4 exactly.
name: h100-qwen2.5-3b-fp16-vllm
milestone: M4
runtime: vllm
model: Qwen/Qwen2.5-3B-Instruct
precision: fp16
tp: 1
dp: 1
max_model_len: 4096
prefix_caching: false
interconnect: SXM  # H100 SXM5; change to PCIe if the pod is an H100 PCIe
pod_hourly_usd: 4.39  # RunPod Secure Cloud price shown on the pod (the recorded runs used 3.99, see docs/findings.md F9)

concurrency: [1, 16, 64, 256]
dataset:
  kind: sharegpt
  output_len: 256
min_requests: 32
requests_per_slot: 4
warmup_requests: 16
repeats: 3
max_cv: 0.05
