# RECIPES R3 open point: c=32 on two GPUs, between the measured c=16 and c=64. Same experiment
# name as the full sweep, so the level slots into that curve.
name: t4x2-qwen2.5-3b-fp16-vllm-tp2
milestone: M3
runtime: vllm
model: Qwen/Qwen2.5-3B-Instruct
precision: fp16
tp: 2
dp: 1
max_model_len: 4096
prefix_caching: false
interconnect: PCIe
pod_hourly_usd: 0.0

concurrency: [32]
dataset:
  kind: sharegpt
  output_len: 256
min_requests: 32
requests_per_slot: 4
warmup_requests: 16
repeats: 3
max_cv: 0.05
