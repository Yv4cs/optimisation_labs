[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infer-lab"
version = "0.1.0"
description = "Reproducible LLM inference benchmarking: latency, throughput and energy per token."
readme = "README.md"
requires-python = ">=3.10"
# Lower bounds only. Exact versions for each environment live in env/lock-*.txt (see docs/methodology.md D-001).
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6",
    "httpx>=0.27",
    "numpy>=1.26",
    "nvidia-ml-py>=12",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
